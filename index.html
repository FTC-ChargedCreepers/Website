<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="8PoundFish FTC team from Redmond, Washington">
  <title>8PoundFish | FTC Team</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #52606d;
      --paper: #f7f5ef;
      --surface: #ffffff;
      --accent: #e4572e;
      --accent-dark: #b83b1f;
      --line: #d9e2ec;
      --max-width: 1080px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      max-width: var(--max-width);
      min-height: 88px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      flex-shrink: 0;
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand img {
      display: block;
      width: 128px;
      height: 96px;
      border-radius: 6px;
      object-fit: contain;
    }

    .brand-name span { color: var(--accent); }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .nav-link {
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 0.45rem 0.75rem;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link[aria-current="page"] {
      border-bottom-color: var(--accent);
      color: var(--accent-dark);
      outline: none;
    }

    main {
      max-width: var(--max-width);
      min-height: calc(100vh - 160px);
      margin: 0 auto;
      padding: 5rem 1.5rem 3rem;
    }

    .page-heading {
      max-width: 760px;
      margin: 0 0 4rem;
    }

    .eyebrow {
      margin: 0 0 0.6rem;
      color: var(--accent-dark);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 8vw, 6.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .content-column {
      max-width: 720px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.5rem;
      max-width: 900px;
    }

    .team-member {
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .team-member img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .team-member figcaption {
      padding: 0.8rem 1rem;
      color: var(--ink);
      font-family: "Trebuchet MS", sans-serif;
    }

    .team-member figcaption h2 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
    }

    .team-member figcaption p {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.5;
      text-transform: none;
    }

    .team-member figcaption p:last-child {
      margin-bottom: 0;
    }

    .team-meta {
      color: var(--accent-dark);
      font-size: 0.8rem !important;
      font-weight: 700 !important;
    }

    section { margin-bottom: 3rem; }

    h2 {
      margin: 0 0 0.75rem;
      color: var(--accent-dark);
      font-size: 2rem;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.12rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.2rem;
      height: 3.2rem;
      margin-top: 0.5rem;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      transition: background 160ms ease, transform 160ms ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      color: #fff;
      background: var(--accent-dark);
      transform: translateY(-2px);
      outline: 3px solid rgba(228, 87, 46, 0.25);
      outline-offset: 3px;
    }

    .social-link svg { width: 1.55rem; height: 1.55rem; fill: currentColor; }

    .blank-page { min-height: 60vh; }

    .site-footer {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 620px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.7rem;
      }

      main { padding-top: 3.5rem; }
      .page-heading { margin-bottom: 3rem; }
      h1 { font-size: 4rem; }

      .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#about" data-page="about" aria-label="8 Pound Fish home">
        <img src="images/8PoundFishLogo.jpeg" alt="8PoundFish logo">
        <span class="brand-name">8 <span>Pound</span> Fish</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="#about" data-page="about">About</a>
        <a class="nav-link" href="#outreach" data-page="outreach">Outreach</a>
        <a class="nav-link" href="#contact" data-page="contact">Contact Us</a>
        <a class="nav-link" href="#team" data-page="team">Meet Our Team</a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">8PoundFish FTC Team · Redmond, Washington</footer>

  <script>
    const pages = {
      about: `
        <div class="page-heading">
          <p class="eyebrow">FTC Team 35813</p>
          <h1>8 Pound Fish</h1>
        </div>
        <div class="content-column">
          <section>
            <h2>Who We Are</h2>
            <p>We are rookie FTC team 35813 "8PoundFish" from Redmond, Washington.</p>
          </section>
          <section>
            <h2>Our Impact</h2>
            <p>As a FIRST team, we have a community impact that stretches beyond the competition field. Through Outreach events, we connect and have a positive impact on the local community we are based in.</p>
          </section>
          <section>
            <h2>Fund us</h2>
            <p><a href="https://secure.givelively.org/donate/washington-first-robotics/eight-pound-fish">Support 8PoundFish</a></p>
          </section>
          <section aria-label="Social media">
            <p>Sub to our YouTube channel</p>
            <a class="social-link" href="https://www.youtube.com/@8poundfishFTC" target="_blank" rel="noreferrer" aria-label="Visit 8PoundFish on YouTube" title="YouTube">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
            </a>
          </section>
        </div>`,
      outreach: '<div class="blank-page" aria-label="Outreach page"></div>',
          contact: `
            <div class="page-heading">
              <p class="eyebrow">FTC Team 35813</p>
              <h1>Contact Us</h1>
            </div>
            <div class="content-column">
              <p>Contact us at: <a href="mailto:8poundfish35813@gmail.com">8poundfish35813@gmail.com</a>.</p>
            </div>`,
          team: `
            <div class="page-heading">
              <p class="eyebrow">FTC Team 35813</p>
              <h1>Meet Our Team</h1>
            </div>
            <div class="team-grid">
              <figure class="team-member">
                <img src="images/eric.jpg" alt="Eric">
                <figcaption>
                  <h2>Eric Wang</h2>
                  <p class="team-meta">Age 12 • 7th Grade, 2026-2027 • Builder/Driver</p>
                  <p>Hi, my name is Eric, and I am a 7th grader at Timberline Middle School. My role in the team is builder and driver. I helped refine the robot design and worked on our engineering notebook. Outside of robotics, I enjoy playing tennis and photography.</p>
                </figcaption>
              </figure>
              <figure class="team-member">
                <img src="images/henry.jpg" alt="Henry">
                <figcaption>
                  <h2>Henry Cheng</h2>
                  <p class="team-meta">Age 13 • 8th Grade, 2026-2027 • Main Builder/Designer</p>
                  <p>Hi! My name is Henry, and I am an 8th grader at International Community School. I am the main builder and designer for our team. I primarily worked on building and designing our robot. Outside of robotics, I enjoy swimming and skiing.</p>
                </figcaption>
              </figure>
              <figure class="team-member">
                <img src="images/jared.jpg" alt="Jared">
                <figcaption>
                  <h2>Jared Wen</h2>
                  <p class="team-meta">Age 12 • 7th Grade, 2026-2027 • Builder/Driver</p>
                  <p>Hi, my name is Jared, and I am a 7th grader at Timberline Middle School. In our team, I am a builder and driver. I primarily helped build the main robot and helped code autonomous. Outside of robotics, I enjoy playing basketball, swimming, and Science Olympiad.</p>
                </figcaption>
              </figure>
              <figure class="team-member">
                <img src="images/letong.png" alt="Letong">
                <figcaption>
                  <h2>Letong Chen</h2>
                  <p class="team-meta">Age 12 • 7th Grade, 2026-2027 • Builder/Driver</p>
                  <p>Hello! My name is Letong, and I am a 7th grader at Timberline Middle School. I am a builder, driver, and the only girl on our team. I helped build the main robot. Outside of robotics, I like ice skating.</p>
                </figcaption>
              </figure>
              <figure class="team-member">
                <img src="images/siyuan.png" alt="Siyuan">
                <figcaption>
                  <h2>Siyuan Chen</h2>
                  <p class="team-meta">Age 12 • 7th Grade, 2026-2027 • Main Programmer</p>
                  <p>Hi, my name is Siyuan, and I am a 7th grader at Timberline Middle School. I am the main programmer for our team. I primarily worked on coding the robot. Outside of robotics, I enjoy skiing, swimming, and running cross country.</p>
                </figcaption>
              </figure>
            </div>`
    };

    const app = document.getElementById('app');

    function renderPage() {
      const page = window.location.hash.slice(1) || 'about';
      const currentPage = pages[page] ? page : 'about';
      app.innerHTML = pages[currentPage];
      const pageTitles = { about: '8PoundFish | FTC Team', outreach: 'Outreach | 8PoundFish', contact: 'Contact Us | 8PoundFish', team: 'Meet Our Team | 8PoundFish' };
      document.title = pageTitles[currentPage];
      document.querySelectorAll('[data-page]').forEach((link) => {
        if (link.tagName === 'A' && link.dataset.page === currentPage) {
          link.setAttribute('aria-current', 'page');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    window.addEventListener('hashchange', renderPage);
    renderPage();
  </script>
</body>
</html>
